{% if page_obj and page_obj.total_pages > 1 %}
<div class="pagination">
  {% if page_obj.has_prev %}<a href="?{{ qs(page=page_obj.page - 1) }}">&laquo; Prev</a>{% endif %}
  <span class="current">Page {{ page_obj.page }} of {{ page_obj.total_pages }}</span>
  {% if page_obj.has_next %}<a href="?{{ qs(page=page_obj.page + 1) }}">Next &raquo;</a>{% endif %}
  <span style="align-self:center; color:var(--color-text-muted); margin-left:8px;">{{ page_obj.total }} total</span>
</div>
{% endif %}
