{% extends "base.html" %}
{% block page_title %}{{ "Edit Laboratory" if lab else "Add Laboratory" }}{% endblock %}
{% block content %}
<div class="card" style="max-width:640px;">
  {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
  <form method="post" action="{{ '/laboratories/%d/edit'|format(lab.id) if lab else '/laboratories/new' }}" class="form-grid">
    <div class="field">
      <label>Laboratory code <span class="req">*</span></label>
      <input name="code" required value="{{ lab.code if lab else '' }}" placeholder="e.g. LAB-204">
    </div>
    <div class="field">
      <label>Name <span class="req">*</span></label>
      <input name="name" required value="{{ lab.name if lab else '' }}" placeholder="e.g. Organic Chemistry Lab">
    </div>
    <div class="field">
      <label>Building</label>
      <input name="building" value="{{ lab.building if lab else 'Research Building' }}">
    </div>
    <div class="field">
      <label>Floor</label>
      <input name="floor" value="{{ lab.floor if lab else '' }}" placeholder="e.g. Floor 2">
    </div>
    <div class="field span-2">
      <label>Description</label>
      <textarea name="description">{{ lab.description if lab else '' }}</textarea>
    </div>
    <div class="btn-row span-2" style="grid-column: span 2;">
      <button type="submit" class="btn btn-primary">{{ "Save Changes" if lab else "Create Laboratory" }}</button>
      <a href="/laboratories" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
